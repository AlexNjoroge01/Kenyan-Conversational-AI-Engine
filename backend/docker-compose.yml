# Local development stack.
#   docker compose up -d postgres            -> database only (run the API on the host with `bun run dev`)
#   docker compose up --build api postgres   -> API + database using Groq + your GPU worker (set GROQ_API_KEY,
#                                               SLM_SERVICE_URL, TTS_SERVICE_URL and WORKER_API_KEY in .env)
#   docker compose --profile gpu up --build  -> also starts local model workers (needs an NVIDIA GPU; point the
#                                               *_SERVICE_URL variables at http://slm-worker:8002 etc.)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kenya_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kenya_engine"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/kenya_engine
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STT_PROVIDER: ${STT_PROVIDER:-groq}
      SLM_PROVIDER: ${SLM_PROVIDER:-http}
      TTS_PROVIDER: ${TTS_PROVIDER:-http}
      STT_SERVICE_URL: ${STT_SERVICE_URL:-http://stt-worker:8001}
      SLM_SERVICE_URL: ${SLM_SERVICE_URL:?Set SLM_SERVICE_URL in .env (e.g. your ngrok domain)}
      TTS_SERVICE_URL: ${TTS_SERVICE_URL:?Set TTS_SERVICE_URL in .env (e.g. your ngrok domain)}
      WORKER_API_KEY: ${WORKER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  stt-worker:
    profiles: ["gpu"]
    build: ../workers/stt-worker
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8001:8001"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }

  slm-worker:
    profiles: ["gpu"]
    build: ../workers/slm-worker
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8002:8002"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }

  tts-worker:
    profiles: ["gpu"]
    build: ../workers/tts-worker
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }

volumes:
  pgdata:
  hf-cache:
